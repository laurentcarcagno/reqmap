services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/reqmap.db
      UPLOAD_DIR: /app/uploads
      CUSTOMERS_CONFIG_PATH: /app/config/customers.json
      CORS_ORIGINS: '["http://localhost:3000"]'
      DEBUG: "false"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    ports:
      - "8090:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:8000
        HTTP_PROXY: http://olfeo.hemeria.local:3129
        HTTPS_PROXY: http://olfeo.hemeria.local:3129
        NO_PROXY: localhost,127.0.0.1,backend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  backend_uploads:
