services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend/app:/app/app
      - ./reqmap:/app/reqmap
      - ./pdf2md:/app/pdf2md
      - ./config:/app/config
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    environment:
      DEBUG: "true"
      RELOAD: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8008:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      BACKEND_URL: http://backend:8000
    command: npm run dev
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
  backend_uploads:
