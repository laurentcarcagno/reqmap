services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend/app:/app/app
      - ./reqmap:/app/reqmap
      - ./config:/app/config
      - ${PDF2MD_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}:/certs/ca.crt:ro
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    environment:
      DEBUG: "true"
      PDF2MD_URL: ${PDF2MD_URL:-https://pdf2md.karka.lan}
      PDF2MD_TOKEN: ${PDF2MD_TOKEN:-}
      PDF2MD_CA_BUNDLE: /certs/ca.crt
      RELOAD: "true"
    # a rootless container cannot reach the host through its LAN address: the server runs on this host
    extra_hosts:
      - "${PDF2MD_HOST:-pdf2md.karka.lan}:${PDF2MD_HOST_IP:-host-gateway}"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8008:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      BACKEND_URL: http://backend:8000
    command: npm run dev
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
  backend_uploads:
